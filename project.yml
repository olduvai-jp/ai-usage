name: MacAIUsage
options:
  bundleIdPrefix: jp.daiki
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: TUYKQ3PV6F
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
targets:
  MacAIUsage:
    type: application
    platform: macOS
    sources: [App, Shared, Providers]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.daiki.MacAIUsage
        PRODUCT_NAME: MacAIUsage
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        LSUIElement: true
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '4'
        CFBundleURLTypes:
          - CFBundleURLName: Usage Details
            CFBundleURLSchemes: [macaiusage]
    dependencies:
      - target: UsageWidget
        embed: true
  UsageWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.daiki.MacAIUsage.Widget
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '4'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  MacAIUsage:
    build:
      targets:
        MacAIUsage: all
